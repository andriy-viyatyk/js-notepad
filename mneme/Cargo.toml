[package]
name = "persephone-mneme"
version = "0.1.0"
edition = "2021"
description = "Mneme — knowledge-base / vector-memory service for Persephone"

[[bin]]
name = "mneme"            # → mneme.exe, matching the architecture docs + CLI
path = "src/main.rs"

[lib]
name = "persephone_mneme"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
ignore = "0.4"            # ripgrep walker — gitignore-style ignore + override allowlist
globset = "0.4"           # wiki_glob pattern matching
regex = "1"               # wiki_grep streaming scan (Concern 6 fallback — same call surface as grep-*)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dirs = "5"                # default config/cache locations for standalone runs

# --- US-653: index + markdown layers ---------------------------------------
rusqlite = { version = "0.37", features = ["bundled"] }  # static SQLite (incl. FTS5); no system lib
sqlite-vec = "0.1"        # vec0 vector extension (bundles its C source, built via cc)
serde_yaml_ng = "0.10"    # YAML frontmatter (maintained successor to the archived serde_yaml)
pulldown-cmark = "0.13"   # markdown parse → heading-aware chunking
chrono = "0.4"            # YYYY-MM-DD parse + SystemTime→date (UTC)
sha2 = "0.10"             # content hash (documents.content_hash)
hex = "0.4"               # sha2 digest → lowercase hex

# --- US-654: indexer + watcher ---------------------------------------------
notify = "8"                   # cross-platform fs watcher (ReadDirectoryChangesW on Windows)
notify-debouncer-full = "0.5"  # coalesced, debounced events; re-exports `notify`

# --- US-655: MCP server (Streamable HTTP) ----------------------------------
rmcp = { version = "1.7", features = ["server", "macros", "transport-streamable-http-server"] }  # official Rust MCP SDK; re-exports schemars
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"                    # StreamableHttpService mounts as a tower service
serde_json = "1"               # structured tool results
base64 = "0.22"                # binary attachment resources (blob = base64)
toml = "0.8"                    # config write-back (figment reads but does not serialize)

# --- US-656: model provisioner --------------------------------------------
ureq = { version = "3", default-features = false, features = ["rustls"] }

# --- US-657: embedding engine ----------------------------------------------
# pyke ONNX Runtime bindings (2.0). `download-binaries` fetches a prebuilt runtime (no
# system install); `directml` enables the DirectML EP on Windows (CPU is the guaranteed
# fallback). Pinned to the rc — `ort = "2"` would not match a pre-release.
ort = { version = "=2.0.0-rc.12", features = ["directml"] }
# HuggingFace tokenizer; `fancy-regex` (pure Rust) avoids a C toolchain dep, and we load
# `tokenizer.json` from disk so the `http`/`hf-hub` downloaders are off.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }  # tamper meta in the schema-mismatch test
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }  # drive async ServerState in mcp tests
tiny_http = "0.12"   # local fixture server for provisioner tests (supports Range)

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit for better optimization
strip = true        # Strip debug symbols
panic = "abort"     # Abort on panic (smaller binary)
