# Mneme configuration (example).
#
# Precedence: built-in defaults < this file < MNEME_-prefixed env vars < CLI flags.
# Config-path precedence (main.rs): --config flag < $MNEME_CONFIG < <os-config-dir>/persephone-mneme/mneme.toml.

# --- Wiki roots -------------------------------------------------------------
# Each root is an independent folder + its own derived index (US-653+).
# A document address is "{name}/{path}" — matching the URI mneme://{name}/{path}.

[[roots]]
name    = "personal"            # root id used in mneme:// URIs (unique; no '/', '\', whitespace)
folder  = "C:/Users/me/wiki"    # absolute OS path; must exist
include = ["*.md"]              # include allowlist (default-deny). Default: ["*.md"]
ignore  = []                    # extra gitignore-style patterns, on top of the built-in
                                #   defaults (.git, .mneme, node_modules, target, dist, build)
                                #   and the root's own .gitignore / .ignore

# [[roots]]
# name   = "work"
# folder = "D:/work/knowledge"

# --- Transport (single Streamable HTTP channel) -----------------------------
# `mneme serve` binds here and serves MCP at http://<bind>:<port>/mcp.
[transport]
bind  = "127.0.0.1"   # loopback by default → no auth needed locally
port  = 7700
# token = "..."       # only meaningful for a non-loopback (networked/Azure) bind

# --- Embedding model --------------------------------------------------------
# `name` + `precision` also derive the index's modelId — the versioned DB path
# .mneme/<name>-<precision>/index-v<schemaVer>.db (default: gte-multilingual-base-int8).
# Read by US-656/657 for downloading/inference; the path is used from US-653 on.
[model]
# name      = "gte-multilingual-base"
# precision = "int8"
# path      = "C:/Users/me/AppData/Roaming/persephone/data/mneme/models"
#             # Cache-base override (US-656). Default: <os-config-dir>/persephone/data/mneme/models.
#             # The provisioner stores model files under <path>/<name>-<precision>-v<version>/.
#             # Set this if you want to keep model files on a different drive or share them
#             # across users. The `mneme model-update` command downloads to this location.

# Embedding inference runs on the CPU (ONNX Runtime CPU execution provider). There is no GPU
# setting: GPU/DirectML was benchmarked and removed (slower than CPU for this small int8 model),
# which also keeps the install free of the DirectML dependency.
